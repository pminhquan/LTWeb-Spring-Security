<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm User' : 'Sửa User'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
<form class="form-card"
      th:object="${userDTO}"
      method="post"
      accept-charset="UTF-8"
      th:action="@{${mode == 'create' ? '/users/create' : '/users/edit/' + (userDTO.id != null ? userDTO.id : '')}}">

    <h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}"></h1>

    <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
        <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
    </div>

    <input type="hidden" th:field="*{id}">

    <div>
        <label for="username">Username</label>
        <input id="username" th:field="*{username}">
        <small class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
    </div>

    <div>
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}">
        <small class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
    </div>

    <div>
        <label for="fullName">Họ tên</label>
        <input id="fullName" th:field="*{fullName}">
        <small class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>
    </div>

    <div>
        <label for="roleName">Role</label>
        <select id="roleName" th:field="*{roleName}">
            <option value="ROLE_USER">USER</option>
            <option value="ROLE_ADMIN">ADMIN</option>
        </select>
    </div>

    <div class="checkbox-group">
        <label><input type="checkbox" th:field="*{enabled}"> Kích hoạt tài khoản (Enabled)</label>
    </div>

    <div class="form-actions">
        <button class="button" type="submit">Lưu</button>
        <a class="button secondary" th:href="@{/users}">Hủy</a>
    </div>
</form>
<p th:if="${mode == 'create'}" class="note mt-3">Mật khẩu mặc định của user do Admin tạo: <b>123456</b>.</p>
</main>
</div>
</body>
</html>
