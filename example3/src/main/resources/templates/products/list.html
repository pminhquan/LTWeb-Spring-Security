<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Products')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <div class="page-header">
        <h1 th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Quản lý Products</h1>
        <h1 th:unless="${#authorization.expression('hasRole(''ADMIN'')')}">Danh sách Products</h1>
    </div>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div class="toolbar">
        <form th:action="@{/products}" method="get">
            <input name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm, mô tả...">
            <input type="hidden" name="size" th:value="${size}">
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <a class="button" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/products/create}">+ Thêm Product</a>
    </div>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th class="col-id">ID</th>
                    <th class="col-thumb">Ảnh</th>
                    <th class="col-name">Tên sản phẩm</th>
                    <th class="col-price">Giá</th>
                    <th class="col-user">Người tạo</th>
                    <th th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="col-action">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${products.content}">
                    <td class="text-center" th:text="${p.id}"></td>
                    <td class="text-center">
                        <img th:if="${p.imageUrl != null and p.imageUrl != ''}"
                             th:src="${#strings.contains(p.imageUrl, '|') ? #strings.substringBefore(p.imageUrl, '|') : p.imageUrl}"
                             class="thumb" alt="Product image">
                        <span th:if="${p.imageUrl == null or p.imageUrl == ''}" class="no-image">No image</span>
                    </td>
                    <td class="col-name" th:text="${p.name}"></td>
                    <td class="col-price" th:text="${p.price != null ? #numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT') + ' đ' : '0 đ'}"></td>
                    <td th:text="${p.username}"></td>
                    <td class="actions" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                        <a class="btn-action edit" th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a>
                        <button type="button" class="btn-action danger"
                                th:attr="data-id=${p.id}, data-name=${p.name}"
                                onclick="openDeleteProductModal(this.getAttribute('data-id'), this.getAttribute('data-name'))">Delete</button>
                    </td>
                </tr>
                <tr th:if="${products.empty}">
                    <td th:colspan="${#authorization.expression('hasRole(''ADMIN'')') ? 6 : 5}" class="text-center">Không có dữ liệu.</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="pagination" th:if="${products.totalPages > 1}">
        <a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number - 1}, size=${size}, keyword=${keyword})}">«</a>
        <span th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}">
            <a th:classappend="${i == products.number ? 'active' : ''}"
               th:href="@{/products(page=${i}, size=${size}, keyword=${keyword})}"
               th:text="${i + 1}"></a>
        </span>
        <a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number + 1}, size=${size}, keyword=${keyword})}">»</a>
    </div>

    <!-- Native accessible delete confirmation modal (ADMIN only) -->
    <dialog id="deleteProductModal" class="native-modal" aria-labelledby="deleteModalTitle" aria-describedby="deleteModalDesc" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        <div class="modal-box">
            <h3 id="deleteModalTitle">Xác nhận xóa sản phẩm</h3>
            <p id="deleteModalDesc">Bạn có chắc chắn muốn xóa sản phẩm <strong id="deleteProductName"></strong> (ID: <span id="deleteProductId"></span>)? Thao tác này không thể hoàn tác.</p>
            <form id="deleteProductForm" method="post" th:action="@{/products/delete/0}" th:attr="data-base-url=@{/products/delete/}">
                <div class="modal-actions">
                    <button type="button" class="button secondary" onclick="closeDeleteProductModal()">Hủy</button>
                    <button type="submit" class="button danger">Xóa</button>
                </div>
            </form>
        </div>
    </dialog>
    <script th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        function openDeleteProductModal(id, name) {
            const modal = document.getElementById('deleteProductModal');
            const form = document.getElementById('deleteProductForm');
            const nameEl = document.getElementById('deleteProductName');
            const idEl = document.getElementById('deleteProductId');
            if (form) {
                form.action = form.getAttribute('data-base-url') + id;
            }
            if (nameEl) nameEl.textContent = name;
            if (idEl) idEl.textContent = id;
            if (modal && typeof modal.showModal === 'function') {
                modal.showModal();
            }
        }
        function closeDeleteProductModal() {
            const modal = document.getElementById('deleteProductModal');
            if (modal && typeof modal.close === 'function') {
                modal.close();
            }
        }
        document.getElementById('deleteProductModal')?.addEventListener('click', function(e) {
            if (e.target === this) {
                closeDeleteProductModal();
            }
        });
    </script>
</main>
</div>
</body>
</html>
