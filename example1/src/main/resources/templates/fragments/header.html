<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="topbar-container">
        <div class="brand">
            <a th:href="@{/home}">LTWeb App</a>
        </div>
        <nav class="nav-links">
            <div sec:authorize="isAuthenticated()" class="auth-info">
                <span class="user-name" th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>
                <span class="user-email" th:text="'(' + ${#authentication.principal.username} + ')'">(user@example.com)</span>
                <span class="user-role badge" th:text="${#authentication.principal.role}">ROLE_USER</span>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-logout">Đăng xuất</button>
                </form>
            </div>
            <div sec:authorize="!isAuthenticated()" class="guest-info">
                <a th:href="@{/login}" class="btn btn-login">Đăng nhập</a>
            </div>
        </nav>
    </div>
</header>
</body>
</html>
